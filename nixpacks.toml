[providers]
python = "python3"
node = "node"

[phases.setup]
nixPkgs = ["python310", "nodejs"]

[phases.install]
cmds = ["python -m venv /opt/venv", ". /opt/venv/bin/activate", "pip install -r requirements.txt", "npm install"]

[start]
cmd = ". /opt/venv/bin/activate && uvicorn main:app --host 0.0.0.0 --port $PORT"
