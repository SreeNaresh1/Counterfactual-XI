  <linearGradient id="g-band-v2" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0%" stop-color="#7F77DD" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#7F77DD" stop-opacity="0.0"/>
  </linearGradient>
  <linearGradient id="g-band-v3" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0%" stop-color="#AFA9EC" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#AFA9EC" stop-opacity="0.0"/>
  </linearGradient>
  <linearGradient id="g-band-t1" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0F6E56" stop-opacity="0.7"/>
    <stop offset="100%" stop-color="#0F6E56" stop-opacity="0.0"/>
