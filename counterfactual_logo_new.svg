  <linearGradient id="g-band-t3" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#5DCAA5" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#5DCAA5" stop-opacity="0.0"/>
  </linearGradient>
