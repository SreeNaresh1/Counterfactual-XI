    <stop offset="35%"  stop-color="#E8E6FF" stop-opacity="0.9"/>
    <stop offset="70%"  stop-color="#7F77DD" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#7F77DD" stop-opacity="0"/>
