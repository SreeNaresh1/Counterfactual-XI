<svg width="680" height="560" viewBox="0 0 680 560" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Counterfactual — reimagined logo</title>
<desc>Two crystalline prism-wings erupt from a blazing singularity at center. The upper wing refracts into violet spectrum bands representing possibility; the lower wing refracts into teal bands representing reality.</desc>

<defs>
  <linearGradient id="burst" x1="0.5" y1="0" x2="0.5" y2="1">
    <stop offset="0%" stop-color="#AFA9EC" stop-opacity="0.0"/>
    <stop offset="48%" stop-color="#7F77DD" stop-opacity="0.9"/>
    <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1"/>
    <stop offset="52%" stop-color="#1D9E75" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#5DCAA5" stop-opacity="0.0"/>
  </linearGradient>
  <linearGradient id="g-upper-fill" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0%" stop-color="#7F77DD" stop-opacity="0.85"/>
    <stop offset="100%" stop-color="#EEEDFE" stop-opacity="0.1"/>
  </linearGradient>
  <linearGradient id="g-lower-fill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1D9E75" stop-opacity="0.85"/>
    <stop offset="100%" stop-color="#E1F5EE" stop-opacity="0.1"/>
  </linearGradient>
  <linearGradient id="g-band-v1" x1="0" y1="1" x2="0" y2="0">
